<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mock Aide</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --card: #fff;
        --ink: #1d1b16;
        --muted: #6b665c;
        --line: #e4dfd4;
        --accent: #8a5a00;
        --warn: #b4234a;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16150f;
          --card: #22201a;
          --ink: #f1ede4;
          --muted: #a8a294;
          --line: #3a362c;
          --accent: #e0a63a;
          --warn: #ff7a98;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 system-ui,
          sans-serif;
      }
      header {
        padding: 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        flex: 1;
      }
      header small {
        color: var(--warn);
      }
      main {
        padding: 16px;
        display: grid;
        gap: 12px;
        max-width: 760px;
        margin: 0 auto;
      }
      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .status {
        font-weight: 600;
        color: var(--accent);
      }
      dl {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 4px 10px;
        margin: 10px 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      button {
        font: inherit;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        cursor: pointer;
        margin: 4px 6px 0 0;
      }
      button.go {
        background: var(--accent);
        color: var(--card);
        border-color: var(--accent);
      }
      button.warn {
        color: var(--warn);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #msg {
        color: var(--warn);
      }
      select,
      input[type='number'],
      input[type='text'] {
        font: inherit;
        padding: 7px 9px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        max-width: 100%;
      }
      input[type='number'] {
        width: 90px;
      }
      .row {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .grow {
        flex: 1;
        min-width: 120px;
      }
      h3 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 14px 0 4px;
      }
      ul {
        margin: 0;
        padding-left: 18px;
      }
      .chat {
        max-height: 180px;
        overflow-y: auto;
        display: grid;
        gap: 4px;
        margin: 6px 0;
      }
      .bubble {
        padding: 6px 10px;
        border-radius: 10px;
        background: var(--bg);
        max-width: 80%;
      }
      .bubble.aide {
        justify-self: end;
        background: var(--accent);
        color: var(--card);
      }
      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Mock Mang Juan aide</h1>
      <small>Dev only. Sees every booking.</small>
      <label
        >Acting as
        <select id="aide" aria-label="Acting as which Manong"></select
      ></label>
      <label><input type="checkbox" id="open" checked /> Open only</label>
      <label><input type="checkbox" id="mine" /> My services only</label>
      <button id="refresh">Refresh</button>
      <button id="sweep" class="warn">Delete all bookings</button>
    </header>
    <main>
      <p id="msg" role="status" aria-live="polite"></p>
      <div id="list"></div>
    </main>
    <script src="mock-aide.js"></script>
  </body>
</html>
